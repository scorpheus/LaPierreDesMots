<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Les deux rayonnages">
  <title>Les deux rayonnages</title>
  <desc>Deux rayonnages en anneau, à gauche et à droite, servent de réceptacles ; deux livres de deux tailles attendent au milieu. Une échelle, un pupitre, une lampe.</desc>
  <!--
    DÉCOR — lot M6, contrat du monde v4 § 2. Trait noir sur blanc, la COULEUR VIENT DU CODE
    (annexe P § 2) : les régions sortent d'ici en grisaille #8E97A8, qui est leur état
    par défaut et non un choix graphique. Géométrie 100 % polygonale (M, L, Z — aucun arc) :
    surface et centroïde sont donc calculables exactement et opposables aux valeurs déclarées
    par le .habillage.json, que scripts/verifier-regions-fermees.mjs --strict recalcule.

    Chaque région est un ENFANT DIRECT de #calque-zones : SceneSvg.tsx sélectionne
    "#calque-zones > [id]", et un tracé niché dans un sous-groupe échapperait au tap sans
    qu'aucun message ne le dise.

    ÉCRIT PAR scripts/dessiner-decors.mjs — ne pas retoucher à la main : la scène est décrite
    dans scripts/decors/decors.mjs, et l'émetteur refuse d'écrire si la mesure est mauvaise.
  -->
  <g id="calque-fond">
    <path class="fond" fill="#FFF6E3" stroke="none" d="M0,0 L960,0 L960,600 L0,600 Z"/>
    <image data-fond-illustre="ecole" href="/LaPierreDesMots/assets/cite-rayonnages-CaNaCS6Q.png" x="0" y="0" width="960" height="600" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g id="calque-zones" fill="#8E97A8" stroke="#1B2440" stroke-width="4" stroke-linejoin="round" opacity="0" aria-hidden="true">
    <path id="mur-de-la-salle" class="zone" data-region-svg="mur-de-la-salle" fill="#8E97A8" fill-rule="evenodd" d="M0,0 L960,0 L960,128 L933.3,132 L906.7,134.9 L880,136 L853.3,134.9 L826.7,132 L800,128 L773.3,124 L746.7,121.1 L720,120 L693.3,121.1 L666.7,124 L640,128 L613.3,132 L586.7,134.9 L560,136 L533.3,134.9 L506.7,132 L480,128 L453.3,124 L426.7,121.1 L400,120 L373.3,121.1 L346.7,124 L320,128 L293.3,132 L266.7,134.9 L240,136 L213.3,134.9 L186.7,132 L160,128 L133.3,124 L106.7,121.1 L80,120 L53.3,121.1 L26.7,124 L0,128 Z"/>
    <path id="parquet-cire" class="zone" data-region-svg="parquet-cire" fill="#8E97A8" fill-rule="evenodd" d="M0,500 L26.7,506.1 L53.3,506.1 L80,500 L106.7,493.9 L133.3,493.9 L160,500 L186.7,506.1 L213.3,506.1 L240,500 L266.7,493.9 L293.3,493.9 L320,500 L346.7,506.1 L373.3,506.1 L400,500 L426.7,493.9 L453.3,493.9 L480,500 L506.7,506.1 L533.3,506.1 L560,500 L586.7,493.9 L613.3,493.9 L640,500 L666.7,506.1 L693.3,506.1 L720,500 L746.7,493.9 L773.3,493.9 L800,500 L826.7,506.1 L853.3,506.1 L880,500 L906.7,493.9 L933.3,493.9 L960,500 L960,600 L0,600 Z"/>
