    <path id="rayonnage-droit" class="zone" data-region-svg="rayonnage-droit" fill="#8E97A8" fill-rule="evenodd" d="M550,180 L872,180 L872,482 L550,482 Z M578,208 L844,208 L844,454 L578,454 Z"/>
    <path id="livre-a-ranger-un" class="zone" data-region-svg="livre-a-ranger-un" fill="#8E97A8" fill-rule="evenodd" d="M444.7,240.7 L491.8,226.5 L496.2,226.5 L543.3,240.7 L543.3,343 L496.2,331.6 L491.8,331.6 L444.7,343 Z"/>
    <path id="livre-a-ranger-deux" class="zone" data-region-svg="livre-a-ranger-deux" fill="#8E97A8" fill-rule="evenodd" d="M443.8,397.5 L484.1,385.3 L487.9,385.3 L528.2,397.5 L528.2,485.4 L487.9,475.6 L484.1,475.6 L443.8,485.4 Z"/>
