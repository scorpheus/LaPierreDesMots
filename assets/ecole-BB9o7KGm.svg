<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 922 615" width="922" height="615" role="img" aria-label="La cour de l’école">
  <title>La cour de l’école</title>
  <!--
    LA MAÎTRESSE SE RECONNAÎT SANS QU'UN ADULTE L'EXPLIQUE (R18) — défaut n° 5, mesuré par
    `tests/unitaires/decor-lisible.test.ts`.

    Avant : les cinq personnages avaient la MÊME silhouette au point près (tête d'arc r=40,
    corps 80 × 64, hauteur 148) ; seul l'identifiant SVG — que l'enfant ne lit pas — portait
    le mot « maitresse ». Trois signes la distinguent maintenant, dans cet ordre de lisibilité :

      1. LA TAILLE. Les quatre élèves sont des enfants : tête r=28, corps 56 × 45, hauteur
         mesurée 104 (fille) et 73 (garçon) contre 148 pour la maîtresse — un rapport de 1,42
         qui se voit d'un coup d'œil, sans comparaison point à point.
      2. UN OBJET DE CLASSE. Le `tableau` sur ses pieds, à côté d'elle, avec deux lignes
         d'écriture. Le décor ne portait aucun objet d'école : ni tableau, ni craie, ni bureau.
      3. LE GESTE. Le bras (calque de trait) la relie au tableau : c'est elle qui y écrit.

    PLACEHOLDER — question Q-R2 de `Docs/questions-en-attente.md`, non tranchée : quel signe
    un enfant de 7 ans lit-il le plus vite, la taille seule ou l'objet ? Les trois sont posés
    ensemble faute d'arbitrage ; en retirer un ne coûte que la suppression de sa forme.

    Les élèves ont été décalés vers la droite (centres 510, 615, 730, 860) pour ouvrir la
    place du tableau entre la maîtresse et le premier élève. Toutes les surfaces et tous les
    centroïdes de `ecole.habillage.json` ont été recalculés en conséquence : ils font foi pour
    la visée (contrat § 5.2), une valeur périmée ferait peindre la région voisine.
  -->
