    <path id="cierge" class="zone" data-region-svg="cierge" fill="#8E97A8" fill-rule="evenodd" d="M149,378 L156.4,396.5 L154,412.3 L149,420.2 L144,412.3 L141.6,396.5 L145.3,422.9 L161.4,422.9 L161.4,502.1 L136.6,502.1 L136.6,422.9 L152.7,422.9 Z"/>
    <path id="banc-de-la-nef" class="zone" data-region-svg="banc-de-la-nef" fill="#8E97A8" fill-rule="evenodd" d="M700,440 L900,428 L908,478 L706,490 Z"/>
  </g>
  <g id="calque-trait" fill="none" stroke="#1B2440" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0" aria-hidden="true">
    <path class="trait" d="M98,520 L862,520"/>
  </g>
</svg>
