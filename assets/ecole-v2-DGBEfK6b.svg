<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 922 615" width="922" height="615" role="img" aria-label="La cour de l’école">
  <title>La cour de l’école</title>
  <!--
    DÉCOR v2 — lot N7, contrat de finition v3 § 4.7. « On doit reconnaître la maîtresse. »

    LES 31 `id` DE RÉGION SONT CEUX DE LA v1, À LA LETTRE. Aucun n'est renommé, aucun ne
    disparaît : `tests/unitaires/ids-regions-stables.test.ts` les nomme un par un contre la
    liste gelée du contrat technique v1 § 9.4, plus le `tableau` de la question Q-R4.
    Un identifiant peut naître, jamais mourir — une consigne qui nomme une région disparue
    est un état sans issue, et c'est le pire défaut possible ici.

    TROIS SIGNES DÉSIGNENT LA MAÎTRESSE, dans cet ordre de lisibilité :
      1. LA TAILLE. 206 unités du haut du crâne au bas de la jupe, contre 134 pour une élève
         et 100 pour un élève : un rapport de 1,54 qui se voit sans comparaison point à point.
         Sa tête mesure 68 de large contre 44. Le seuil opposable est 1,35 (§ 9.2).
      2. L'OBJET DE CLASSE. Le `tableau`, sur ses deux pieds, avec ses lignes d'écriture,
         posé ENTRE elle et le premier élève — un tableau à l'autre bout de la cour ne
         désignerait personne.
      3. LE GESTE. Le bras (calque de trait) la relie au tableau : c'est elle qui y écrit.

    LES ARBRES ONT UN TRONC ET UN HOUPPIER LOBÉ. La v1 dessinait un disque parfait au-dessus
    d'un rectangle ; un disque se lit « ballon ». Le houppier oscille entre 42 et 54 unités de
    rayon sur six lobes, et `decor-reconnaissable.test.ts` mesure cette rondeur : < 0,85 pour
    un arbre, > 0,95 pour le ballon. La même mesure distingue les deux.

    TOUTE LA GÉOMÉTRIE EST POLYGONALE (M/L/Z), sans un seul arc. Ce n'est pas un choix de
    style : c'est ce qui rend la surface et le centroïde de chaque région calculables
    exactement, donc opposables aux valeurs déclarées par `ecole.habillage.json`. Elles
    donnent son rayon de visée à `regionSousLeDoigt` et son origine au balayage de
    recoloration — une valeur périmée ferait peindre la région voisine.
    `scripts/verifier-regions-fermees.mjs` les remesure à chaque `npm run test`.

    Chaque région est un enfant DIRECT de `#calque-zones` : `SceneSvg.tsx:335` sélectionne
    `#calque-zones > [id]`, et un tracé niché dans un sous-groupe échapperait au tap sans
    qu'aucun message ne le dise.
  -->
  <g id="calque-fond">
