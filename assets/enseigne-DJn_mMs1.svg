    <path id="lanterne-de-l-enseigne" class="zone" data-region-svg="lanterne-de-l-enseigne" fill="#8E97A8" fill-rule="evenodd" d="M791.1,418 L816.9,418 L809.5,432.6 L829.8,442.4 L837.1,459.5 L831.6,510.7 L840.8,522.9 L840.8,535.1 L767.2,535.1 L767.2,522.9 L776.4,510.7 L770.9,459.5 L778.2,442.4 L798.5,432.6 Z"/>
  </g>
  <g id="calque-trait" fill="none" stroke="#1B2440" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0" aria-hidden="true">
    <path class="trait" d="M0,492 L960,484"/>
  </g>
</svg>
