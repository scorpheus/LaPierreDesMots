  <title>Gobi qui aide</title>
  <desc>Etat d animation « aide », l un des cinq de l addendum § A.2. Un bras tendu vers l enfant, paume ouverte. L aide ne coute rien et n est jamais un echec. Dessine a partir de la canonique verrouillee production/personnages/gobi/canonique.png (D36, qui clot l etape A de D31). Toutes les couleurs viennent de la palette MESUREE sur ses pixels et consignee dans production/personnages/gobi/gobi.lock.json ; aucune n est choisie a la main. Le groupe gobi-corps est OCTET POUR OCTET le meme dans les quinze fichiers qui montrent Gobi : c est D20 et D28 rendus mecaniques — le corps ne change jamais, le cristal porte les declinaisons. En couleur, et non en trait noir : Gobi n est pas une zone a recolorier (D29).</desc>
