    <script type="module" crossorigin src="/LaPierreDesMots/assets/index-CDFg5PwU.js"></script>

  <body>
    <div id="racine"></div>
    <noscript>
      Cette application a besoin de JavaScript. Demande à un adulte de l’activer.
    </noscript>
    <script>
      // GitHub Pages sert `404.html` pour une route profonde. Ce repli depose l'URL
      // demandee ici ; elle est restauree avant le montage de React et du routeur.
      (() => {
        const cle = 'pierre-route-pages';
        const route = sessionStorage.getItem(cle);
        sessionStorage.removeItem(cle);
        if (route?.startsWith('/LaPierreDesMots/')) {
          history.replaceState(null, '', route);
        }
      })();
    </script>
    <!-- Cette seconde entree est eliminee presque entierement hors du mode `pwa`.
         Elle garde l'enregistrement du service worker hors de la racine React. -->
  </body>
