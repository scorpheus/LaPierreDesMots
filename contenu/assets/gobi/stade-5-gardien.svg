<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Gobi, stade 5 : le Gardien">
  <title>Gobi — stade 5, le Gardien</title>
  <desc>PLACEHOLDER — forme canonique non validée (D7, D31 étape A). Bouchon écrit à la main (D2). Le stade final de D28 : « le compagnon plus structuré, plus équipé, plus héroïque ». La cape et la crête complète s'ajoutent au corps du stade 2, qui n'a pas bougé. Posture ouverte et tournée vers l'enfant, jamais toisante (D31).</desc>
  <g id="gobi-cape">
