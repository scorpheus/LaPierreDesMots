    <circle id="oeil-droit" cx="120" cy="104" r="14" fill="#FFF6E3" stroke="#1B2440" stroke-width="4"/>
    <circle id="pupille-gauche" cx="82" cy="106" r="6" fill="#1B2440"/>
    <circle id="pupille-droite" cx="122" cy="106" r="6" fill="#1B2440"/>
    <path id="sourire" d="M82,132 C92,146 108,146 118,132 C112,154 88,154 82,132 Z" fill="#1B2440" stroke="#1B2440" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g id="gobi-cristal">
    <path id="cristal-gauche" d="M68,34 L80,58 L68,70 L58,58 Z" fill="#2FA8E0" stroke="#1B2440" stroke-width="5" stroke-linejoin="round"/>
