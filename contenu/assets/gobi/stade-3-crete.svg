<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Gobi, stade 3 : la Crête">
  <title>Gobi — stade 3, la Crête</title>
  <desc>PLACEHOLDER — forme canonique non validée (D7, D31 étape A). Bouchon écrit à la main (D2). Le corps est celui du stade 2, inchangé : c'est la CRÊTE de cristaux qui pousse (D20, D31 « base retenue : la proposition 06, corps rond, bras, besace, crête de cristaux »).</desc>
