    <path id="bras-droit" d="M158,120 C174,118 184,128 184,140 C184,152 174,160 160,158 C150,156 148,140 150,130 Z" fill="#FF5D8F" stroke="#1B2440" stroke-width="5" stroke-linejoin="round"/>
    <circle id="main-gauche" cx="26" cy="142" r="11" fill="#FFC0D6" stroke="#1B2440" stroke-width="4"/>
    <circle id="main-droite" cx="174" cy="142" r="11" fill="#FFC0D6" stroke="#1B2440" stroke-width="4"/>
  </g>
