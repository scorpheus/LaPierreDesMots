<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Gobi, stade 1 : l’Œuf de cristal">
  <title>Gobi — stade 1, l’Œuf de cristal</title>
  <desc>PLACEHOLDER — la forme canonique de Gobi n'est PAS validée (D7, D31 étape A) et l'étape A n'est pas automatisable : c'est une validation humaine, qu'aucun lot ne contourne. Bouchon écrit à la main (D2). Il tient les trois règles déjà tranchées : structure cristalline (D20), deux bras courts et robustes (D24), yeux ouverts et sourire franc, posture tournée vers l'enfant (D31). En couleur, et non en trait noir : Gobi n'est pas une zone à recolorier (D29).</desc>
  <g id="gobi-corps">
    <path id="corps" d="M100,26 C136,26 158,68 158,110 C158,152 132,176 100,176 C68,176 42,152 42,110 C42,68 64,26 100,26 Z" fill="#FF5D8F" stroke="#1B2440" stroke-width="6" stroke-linejoin="round"/>
    <path id="ventre" d="M100,96 C122,96 136,114 136,134 C136,154 120,166 100,166 C80,166 64,154 64,134 C64,114 78,96 100,96 Z" fill="#FFC0D6" stroke="#1B2440" stroke-width="4" stroke-linejoin="round"/>
  </g>
