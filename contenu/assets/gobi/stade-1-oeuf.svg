    <circle id="pupille-droite" cx="120" cy="94" r="6" fill="#1B2440"/>
    <path id="sourire" d="M84,120 C92,132 108,132 116,120 C110,138 90,138 84,120 Z" fill="#1B2440" stroke="#1B2440" stroke-width="3" stroke-linejoin="round"/>
