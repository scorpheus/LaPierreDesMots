    <path id="bras-gauche" d="M46,112 C32,112 24,122 24,132 C24,142 32,150 44,148 C52,146 54,134 52,124 Z" fill="#FF5D8F" stroke="#1B2440" stroke-width="5" stroke-linejoin="round"/>
    <path id="bras-droit" d="M154,112 C168,112 176,122 176,132 C176,142 168,150 156,148 C148,146 146,134 148,124 Z" fill="#FF5D8F" stroke="#1B2440" stroke-width="5" stroke-linejoin="round"/>
  </g>
