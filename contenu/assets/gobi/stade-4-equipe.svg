<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Gobi, stade 4 : l’Équipé">
  <title>Gobi — stade 4, l’Équipé</title>
  <desc>PLACEHOLDER — forme canonique non validée (D7, D31 étape A). Bouchon écrit à la main (D2). Le corps et la crête du stade 3 sont repris tels quels ; s'y ajoute la besace de D31. Les bras servent enfin à quelque chose : ils portent (D24).</desc>
