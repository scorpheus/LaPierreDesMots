    <path id="torche-de-la-fresque" class="zone" data-region-svg="torche-de-la-fresque" fill="#8E97A8" fill-rule="evenodd" d="M48,300 L59.5,322.7 L55.7,342.6 L63.4,339.8 L55.7,362.5 L58.2,442 L37.8,442 L40.3,362.5 L32.6,339.8 L40.3,342.6 L36.5,322.7 Z"/>
    <path id="eclat-de-roche" class="zone" data-region-svg="eclat-de-roche" fill="#8E97A8" fill-rule="evenodd" d="M902,300 L932,325.8 L925.4,379.1 L902,392 L878.6,379.1 L872,325.8 Z"/>
  </g>
  <g id="calque-trait" fill="none" stroke="#1B2440" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0" aria-hidden="true">
    <path class="trait" d="M130,300 L340,300"/>
    <path class="trait" d="M380,290 L600,290"/>
    <path class="trait" d="M640,310 L820,310"/>
  </g>
</svg>
