    <path id="roseau-deux" class="zone" data-region-svg="roseau-deux" fill="#8E97A8" fill-rule="evenodd" d="M414.9,471.4 L429,319.8 L410.8,195.8 L381.2,200.2 L399,320.2 L385.1,468.6 Z"/>
