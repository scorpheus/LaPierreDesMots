    <path id="bol" class="zone" data-region-svg="bol" fill="#8E97A8" fill-rule="evenodd" d="M430,402 L546,402 L524,462 L452,462 Z"/>
  </g>
  <g id="calque-trait" fill="none" stroke="#1B2440" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0" aria-hidden="true">
    <path class="trait" d="M100,562 L100,596"/>
    <path class="trait" d="M860,562 L860,596"/>
    <path class="trait" d="M38,470 L922,470"/>
  </g>
</svg>
