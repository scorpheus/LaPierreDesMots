    <path id="mur-du-fond" class="zone" data-region-svg="mur-du-fond" fill="#8E97A8" fill-rule="evenodd" d="M0,0 L960,0 L960,168 L933.3,170.7 L906.7,173.1 L880,174.9 L853.3,175.9 L826.7,175.9 L800,174.9 L773.3,173.1 L746.7,170.7 L720,168 L693.3,165.3 L666.7,162.9 L640,161.1 L613.3,160.1 L586.7,160.1 L560,161.1 L533.3,162.9 L506.7,165.3 L480,168 L453.3,170.7 L426.7,173.1 L400,174.9 L373.3,175.9 L346.7,175.9 L320,174.9 L293.3,173.1 L266.7,170.7 L240,168 L213.3,165.3 L186.7,162.9 L160,161.1 L133.3,160.1 L106.7,160.1 L80,161.1 L53.3,162.9 L26.7,165.3 L0,168 Z"/>
