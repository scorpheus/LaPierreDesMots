    <path id="table" class="zone" data-region-svg="table" fill="#8E97A8" fill-rule="evenodd" d="M38,470 L922,470 L900,562 L60,562 Z"/>
    <path id="panier-gauche" class="zone" data-region-svg="panier-gauche" fill="#8E97A8" fill-rule="evenodd" d="M191.3,247.8 L222.4,247.8 L226.8,213.9 L289,188.5 L351.2,213.9 L355.6,247.8 L386.7,247.8 L364.5,383.5 L213.5,383.5 Z M249,247.8 L329,247.8 L324.5,226.6 L289,213.9 L253.5,226.6 Z"/>
