    <path class="fond" fill="#FFF6E3" stroke="none" d="M0,0 L960,0 L960,600 L0,600 Z"/>
    <image data-fond-illustre="ecole" href="/api/contenu/assets/assets/decors/exercices/foret-souche.png" x="0" y="0" width="960" height="600" preserveAspectRatio="xMidYMid slice"/>
  </g>
