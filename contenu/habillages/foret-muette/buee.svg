<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="La buée sur la vitre">
  <title>La buée sur la vitre</title>
  <desc>Une fenêtre : le cadre en anneau, la vitre embuée à l’intérieur, le tracé qu’un doigt y a laissé, un rideau sur le côté, le rebord et un pot posé dessus. Dehors, la forêt.</desc>
  <!--
    DÉCOR — lot M6, contrat du monde v4 § 2. Trait noir sur blanc, la COULEUR VIENT DU CODE
    (annexe P § 2) : les régions sortent d'ici en grisaille #8E97A8, qui est leur état
    par défaut et non un choix graphique. Géométrie 100 % polygonale (M, L, Z — aucun arc) :
    surface et centroïde sont donc calculables exactement et opposables aux valeurs déclarées
    par le .habillage.json, que scripts/verifier-regions-fermees.mjs --strict recalcule.

    Chaque région est un ENFANT DIRECT de #calque-zones : SceneSvg.tsx sélectionne
    "#calque-zones > [id]", et un tracé niché dans un sous-groupe échapperait au tap sans
    qu'aucun message ne le dise.

    ÉCRIT PAR scripts/dessiner-decors.mjs — ne pas retoucher à la main : la scène est décrite
    dans scripts/decors/decors.mjs, et l'émetteur refuse d'écrire si la mesure est mauvaise.
  -->
  <g id="calque-fond">
    <path class="fond" fill="#FFF6E3" stroke="none" d="M0,0 L960,0 L960,600 L0,600 Z"/>
    <image data-fond-illustre="ecole" href="/api/contenu/assets/assets/decors/exercices/foret-buee.png" x="0" y="0" width="960" height="600" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g id="calque-zones" fill="#8E97A8" stroke="#1B2440" stroke-width="4" stroke-linejoin="round" opacity="0" aria-hidden="true">
    <path id="foret-dehors" class="zone" data-region-svg="foret-dehors" fill="#8E97A8" fill-rule="evenodd" d="M0,0 L960,0 L960,238 L933.3,246 L906.7,251.9 L880,254 L853.3,251.9 L826.7,246 L800,238 L773.3,230 L746.7,224.1 L720,222 L693.3,224.1 L666.7,230 L640,238 L613.3,246 L586.7,251.9 L560,254 L533.3,251.9 L506.7,246 L480,238 L453.3,230 L426.7,224.1 L400,222 L373.3,224.1 L346.7,230 L320,238 L293.3,246 L266.7,251.9 L240,254 L213.3,251.9 L186.7,246 L160,238 L133.3,230 L106.7,224.1 L80,222 L53.3,224.1 L26.7,230 L0,238 Z"/>
