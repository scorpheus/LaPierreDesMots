    <path id="rebord" class="zone" data-region-svg="rebord" fill="#8E97A8" fill-rule="evenodd" d="M60,470 L900,456 L912,516 L52,530 Z"/>
    <path id="cadre" class="zone" data-region-svg="cadre" fill="#8E97A8" fill-rule="evenodd" d="M250,90 L900,90 L900,470 L250,470 Z M290,130 L860,130 L860,430 L290,430 Z"/>
    <path id="vitre-embuee" class="zone" data-region-svg="vitre-embuee" fill="#8E97A8" fill-rule="evenodd" d="M290,130 L860,130 L860,430 L290,430 Z"/>
    <path id="doigt-trace" class="zone" data-region-svg="doigt-trace" fill="#8E97A8" fill-rule="evenodd" d="M353.6,207.7 L470.2,302.2 L390.9,384.2 L529.6,421.7 L534.4,402.3 L409.1,375.8 L489.8,297.8 L366.4,192.3 Z"/>
