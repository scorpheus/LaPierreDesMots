    <path id="pot-sur-le-rebord" class="zone" data-region-svg="pot-sur-le-rebord" fill="#8E97A8" fill-rule="evenodd" d="M144,400 L216,400 L206,468 L154,468 Z"/>
  </g>
  <g id="calque-trait" fill="none" stroke="#1B2440" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0" aria-hidden="true">
    <path class="trait" d="M52,530 L912,516"/>
  </g>
</svg>
