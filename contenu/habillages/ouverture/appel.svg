<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Le chemin part vers la Clairiere">
  <title>Viens</title>
  <desc>PLACEHOLDER — decor bouchon ecrit a la main (D2), lot N4, tableau 5 sur 5 (D35). Le dernier tableau ne raconte plus, il OUVRE : le chemin part du bas de l ecran, la ou l enfant a le doigt, et file vers la Clairiere deja verte au loin. Aucun obstacle sur ce chemin, aucune porte, aucune etape — c est la traduction en image de D46 : « partir en sortie se fait en un tap, aucun ecran intermediaire obligatoire, nulle part ». Toutes les formes sont fermees par un Z.</desc>
  <g id="calque-ciel">
