    <path id="gobi-bras-gauche" d="M486,440 L392,368 L360,410 L458,494 Z" fill="#C9A7E8"/>
    <path id="gobi-bras-droit" d="M714,440 L808,368 L840,410 L742,494 Z" fill="#C9A7E8"/>
    <path id="gobi-coeur" d="M600,452 L644,506 L600,560 L556,506 Z" fill="#FFC93C"/>
    <path id="gobi-cristal-1" d="M544,300 L568,232 L594,300 Z" fill="#8FD6F2"/>
    <path id="gobi-cristal-2" d="M594,300 L612,206 L634,300 Z" fill="#3DDC97"/>
    <path id="gobi-cristal-3" d="M634,300 L664,244 L682,300 Z" fill="#FF5D8F"/>
    <path id="gobi-oeil-gauche" d="M556,378 L578,356 L600,378 L578,400 Z" fill="#1B2440"/>
    <path id="gobi-oeil-droit" d="M624,378 L646,356 L668,378 L646,400 Z" fill="#1B2440"/>
