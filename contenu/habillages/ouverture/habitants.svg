<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Gobi et les quatre compagnons attendent l enfant">
  <title>Les habitants t’attendent</title>
  <desc>PLACEHOLDER — decor bouchon ecrit a la main (D2), lot N4, tableau 4 sur 5 (D35). Gobi au centre, plus grand, bras courts leves et ouverts en posture d accueil (D24, D36), coeur de Pierre lumineux au ventre (D36) et couronne de cristaux sur le crane. Les quatre compagnons de `contenu/monde/compagnons.json` l entourent, dans l ordre des regions : Filou, Bulle, Roc, Plume. C EST UN BOUCHON : le vrai Gobi vient de N3, qui verrouille la canonique et la decline. Les formes de ce fichier ne pretendent pas etre le personnage — elles tiennent la place et la composition. Toutes fermees par un Z.</desc>
  <g id="calque-fond">
    <path id="fond" d="M0,0 L1200,0 L1200,800 L0,800 Z" fill="#FFF6E3"/>
    <path id="sol" d="M0,640 L1200,640 L1200,800 L0,800 Z" fill="#3DDC97"/>
  </g>
  <g id="calque-gobi" stroke="#1B2440" stroke-width="7" stroke-linejoin="round">
