<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Le vitrail à inventer">
  <title>Le vitrail à inventer</title>
  <desc>Décor de COLORIAGE : trait noir sur blanc, régions fermées par construction, couleur appliquée par le code depuis les jetons de palette (annexe P § 2). Chaque région est un enfant DIRECT de #calque-zones — SceneSvg sélectionne « #calque-zones &gt; [id] » et un tracé niché dans un sous-groupe échapperait au tap sans qu’aucun message ne le dise. Les centroïdes et surfaces du .habillage.json sont recalculés par le générateur, jamais écrits à la main.</desc>
