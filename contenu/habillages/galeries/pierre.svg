    <path id="goutte-sur-la-dalle" class="zone" data-region-svg="goutte-sur-la-dalle" fill="#8E97A8" fill-rule="evenodd" d="M872,300 L882,344.7 L887,348.8 L890.5,354.3 L892,360.7 L891.3,367.2 L888.6,373.1 L884.2,377.9 L878.4,380.9 L872,382 L865.6,380.9 L859.8,377.9 L855.4,373.1 L852.7,367.2 L852,360.7 L853.5,354.3 L857,348.8 L862,344.7 Z"/>
  </g>
  <g id="calque-trait" fill="none" stroke="#1B2440" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0" aria-hidden="true">
    <path class="trait" d="M200,260 L740,246"/>
    <path class="trait" d="M200,452 L764,438"/>
  </g>
</svg>
