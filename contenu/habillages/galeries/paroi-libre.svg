    <path id="sol-de-la-paroi" class="zone" data-region-svg="sol-de-la-paroi" fill="#8E97A8" fill-rule="evenodd" d="M0,540 L26.7,545.8 L53.3,548.9 L80,547.8 L106.7,543.1 L133.3,536.9 L160,532.2 L186.7,531.1 L213.3,534.2 L240,540 L266.7,545.8 L293.3,548.9 L320,547.8 L346.7,543.1 L373.3,536.9 L400,532.2 L426.7,531.1 L453.3,534.2 L480,540 L506.7,545.8 L533.3,548.9 L560,547.8 L586.7,543.1 L613.3,536.9 L640,532.2 L666.7,531.1 L693.3,534.2 L720,540 L746.7,545.8 L773.3,548.9 L800,547.8 L826.7,543.1 L853.3,536.9 L880,532.2 L906.7,531.1 L933.3,534.2 L960,540 L960,600 L0,600 Z"/>
