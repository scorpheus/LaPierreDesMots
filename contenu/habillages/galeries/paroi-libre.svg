    <path id="goutte-de-pluie" class="zone" data-region-svg="goutte-de-pluie" fill="#8E97A8" fill-rule="evenodd" d="M700,148 L712,205.2 L718,210.2 L722.2,216.8 L723.9,224.4 L723.2,232.2 L720,239.3 L714.6,245 L707.7,248.7 L700,250 L692.3,248.7 L685.4,245 L680,239.3 L676.8,232.2 L676.1,224.4 L677.8,216.8 L682,210.2 L688,205.2 Z"/>
