<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Les trois grottes">
  <title>Les trois grottes</title>
  <image data-fond-illustre="grottes" href="/api/contenu/assets/assets/decors/exercices/galeries-grottes.png" x="0" y="0" width="960" height="600" preserveAspectRatio="xMidYMid slice"/>
  <!--
    DÉCOR v2 — lot N7. Les Galeries cessent d'être six rectangles.

    LE DÉFAUT DE LA v1, MESURÉ : `grottes.svg` dessinait six `<rect>` de 200 × 160 arrondis
    à 12, tous identiques, tous de surface 32000, simplement translatés. « La première
    grotte » et « la voûte » y étaient le MÊME dessin. C'est le défaut jumeau de celui de la
    maîtresse, et il n'avait jamais été relevé parce que personne n'a encore joué les Galeries.

    Les six `id` gelés sont conservés à la lettre. La scène se lit maintenant comme une
    grotte : la voûte coiffe le haut, la stalactite pend du plafond (plus haute que large),
    la flaque s'étale au sol, et les trois bouches de grotte ont trois tailles et trois
    formes différentes. `decor-reconnaissable.test.ts` mesure les six silhouettes et les six
    surfaces : aucune paire ne se ressemble.
  -->
  <g id="calque-fond" opacity="0" aria-hidden="true">
    <path class="fond" fill="#FFF6E3" stroke="none" d="M0,0 L960,0 L960,600 L0,600 Z"/>
  </g>
  <g id="calque-zones" opacity="0" fill="#8E97A8" stroke="#1B2440" stroke-width="4" stroke-linejoin="round">
