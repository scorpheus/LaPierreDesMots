    <path id="lampe" class="zone" data-region-svg="lampe" fill="#8E97A8" fill-rule="evenodd" d="M89.1,468 L114.9,468 L107.5,482.6 L127.8,492.4 L135.1,509.5 L129.6,560.7 L138.8,572.9 L138.8,585.1 L65.2,585.1 L65.2,572.9 L74.4,560.7 L68.9,509.5 L76.2,492.4 L96.5,482.6 Z"/>
    <path id="eclat-de-quartz" class="zone" data-region-svg="eclat-de-quartz" fill="#8E97A8" fill-rule="evenodd" d="M560,458 L590,481 L583.4,528.5 L560,540 L536.6,528.5 L530,481 Z"/>
  </g>
  <g id="calque-trait" fill="none" stroke="#1B2440" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0" aria-hidden="true">
    <path class="trait" d="M60,250 L880,228"/>
  </g>
</svg>
