<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="La veine de quartz">
  <title>La veine de quartz</title>
  <desc>Le filon qui barre la paroi, la veine claire qui le traverse en serpentant, un bloc de quartz facetté, le marteau, un copeau, la lampe posée et un éclat de quartz.</desc>
  <!--
    DÉCOR — lot M6, contrat du monde v4 § 2. Trait noir sur blanc, la COULEUR VIENT DU CODE
    (annexe P § 2) : les régions sortent d'ici en grisaille #8E97A8, qui est leur état
    par défaut et non un choix graphique. Géométrie 100 % polygonale (M, L, Z — aucun arc) :
    surface et centroïde sont donc calculables exactement et opposables aux valeurs déclarées
    par le .habillage.json, que scripts/verifier-regions-fermees.mjs --strict recalcule.

    Chaque région est un ENFANT DIRECT de #calque-zones : SceneSvg.tsx sélectionne
    "#calque-zones > [id]", et un tracé niché dans un sous-groupe échapperait au tap sans
    qu'aucun message ne le dise.

    ÉCRIT PAR scripts/dessiner-decors.mjs — ne pas retoucher à la main : la scène est décrite
    dans scripts/decors/decors.mjs, et l'émetteur refuse d'écrire si la mesure est mauvaise.
  -->
  <g id="calque-fond">
    <path class="fond" fill="#FFF6E3" stroke="none" d="M0,0 L960,0 L960,600 L0,600 Z"/>
    <image data-fond-illustre="ecole" href="/api/contenu/assets/assets/decors/exercices/galeries-veine.png" x="0" y="0" width="960" height="600" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g id="calque-zones" fill="#8E97A8" stroke="#1B2440" stroke-width="4" stroke-linejoin="round" opacity="0" aria-hidden="true">
    <path id="paroi-de-la-mine" class="zone" data-region-svg="paroi-de-la-mine" fill="#8E97A8" fill-rule="evenodd" d="M0,0 L960,0 L960,168 L933.3,173.8 L906.7,176.9 L880,175.8 L853.3,171.1 L826.7,164.9 L800,160.2 L773.3,159.1 L746.7,162.2 L720,168 L693.3,173.8 L666.7,176.9 L640,175.8 L613.3,171.1 L586.7,164.9 L560,160.2 L533.3,159.1 L506.7,162.2 L480,168 L453.3,173.8 L426.7,176.9 L400,175.8 L373.3,171.1 L346.7,164.9 L320,160.2 L293.3,159.1 L266.7,162.2 L240,168 L213.3,173.8 L186.7,176.9 L160,175.8 L133.3,171.1 L106.7,164.9 L80,160.2 L53.3,159.1 L26.7,162.2 L0,168 Z"/>
    <path id="sol-de-la-mine" class="zone" data-region-svg="sol-de-la-mine" fill="#8E97A8" fill-rule="evenodd" d="M0,530 L26.7,536.1 L53.3,537.9 L80,534 L106.7,527.3 L133.3,522.5 L160,523.1 L186.7,528.6 L213.3,535.1 L240,538 L266.7,535.1 L293.3,528.6 L320,523.1 L346.7,522.5 L373.3,527.3 L400,534 L426.7,537.9 L453.3,536.1 L480,530 L506.7,523.9 L533.3,522.1 L560,526 L586.7,532.7 L613.3,537.5 L640,536.9 L666.7,531.4 L693.3,524.9 L720,522 L746.7,524.9 L773.3,531.4 L800,536.9 L826.7,537.5 L853.3,532.7 L880,526 L906.7,522.1 L933.3,523.9 L960,530 L960,600 L0,600 Z"/>
    <path id="filon" class="zone" data-region-svg="filon" fill="#8E97A8" fill-rule="evenodd" d="M60,230 L880,208 L902,420 L40,442 Z"/>
    <path id="veine" class="zone" data-region-svg="veine" fill="#8E97A8" fill-rule="evenodd" d="M103,312.7 L278.9,271 L459.3,343 L639.6,291 L838.1,354.4 L845.9,329.6 L640.4,265 L460.7,317 L281.1,245 L97,287.3 Z"/>
    <path id="quartz" class="zone" data-region-svg="quartz" fill="#8E97A8" fill-rule="evenodd" d="M300,138 L356,183.4 L343.7,277.3 L300,300 L256.3,277.3 L244,183.4 Z"/>
    <path id="marteau" class="zone" data-region-svg="marteau" fill="#8E97A8" fill-rule="evenodd" d="M712.2,128.3 L787.8,128.3 L809.8,145.5 L809.8,179.9 L787.8,197.1 L770.8,197.1 L768.3,290 L748.8,290 L751.2,197.1 L712.2,197.1 Z"/>
