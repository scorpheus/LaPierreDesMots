# Crochets git — contrat technique v1 § 1.1, CLAUDE.md « Commandes ».
#
# Installation : AUTOMATIQUE. Le script `prepare` du package.json racine lance
# `lefthook install` à chaque `npm install` / `npm ci`.
#
# C'est un ajout à la section `scripts` prescrite par le contrat § 8, et il est assumé :
# sans lui, sur une machine neuve, les crochets ne sont jamais posés et le premier commit
# passe sans lint ni tests — un filet qu'il faut penser à tendre n'est pas un filet.
# Écart déclaré dans `Docs/ecarts-au-contrat-chaine-verifier.md`.
#
# Pour le poser à la main si besoin :
#     npx lefthook install
#
# Pour passer outre ponctuellement — à n'utiliser que si on sait pourquoi :
#     LEFTHOOK=0 git commit ...

pre-commit:
  parallel: false
  commands:
    validation:
      # Même contenu que la campagne complète : réutilisation ; sinon lint et logique.
      # Le contrôle des tests trompeurs ci-dessous reste systématique.
      run: node scripts/verifier-commit.mjs
      fail_text: |
        Le lint ou les tests de logique refusent le commit. Corriger le défaut indiqué.
    trompeurs:
      # Deux secondes, et c'est la SEULE traduction mecanique de la phrase ci-dessus.
      #
      # Jusqu'au lot Q5, « on ne met JAMAIS un test en skip » n'existait que dans ce
      # `fail_text` et dans CLAUDE.md : aucune commande ne le verifiait. Un test desactive
      # ou sans assertion passait le crochet sans un mot. Il est ici et pas au `pre-push`
      # parce qu'un test creux se corrige quand on vient de l'ecrire, pas trois jours apres.
      run: npm run qa:trompeurs
      fail_text: |
        Un test ne prouve pas ce qu'il annonce.
        · BLOQUANT : un cas sans aucune assertion, ou desactive par `.skip` / `.only`.
          Un test desactive est un mensonge dans le rapport (CLAUDE.md, regle non negociable).
        · PLAFOND : le nombre d'avertissements a monte. Corriger le nouveau, ou justifier
          la montee par ecrit dans Docs/questions-en-attente.md — jamais en silence.
        Le detail nomme le fichier, la ligne, le cas et le remede.

pre-push:
  parallel: false
  commands:
    verifier:
      # Réutilise uniquement une campagne complète aux entrées et rapports inchangés.
      # Sinon toute la chaîne est exécutée ; le dépôt propre lie les fichiers au commit.
      run: npm run verifier -- --si-necessaire --exiger-propre
      fail_text: |
        `npm run verifier` sort en echec.
        Le rapport consolide est dans tests/rapports/RAPPORT.md — c'est lui qui fait foi,
        pas la sortie brute ci-dessus.
